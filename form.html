<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Product Review Form - WDD 131">
  <meta name="author" content="Samson Omale">
  <title>Product Review | WDD 131</title>
  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/form.js" defer></script>
</head>
<body>
  <header>
    <h1>⭐ Product Review</h1>
  </header>

  <main>
    <form method="get" action="review.html">
      
      <!-- Product Name -->
      <fieldset>
        <legend>Product Information</legend>

        <label for="product">Product Name</label>
        <select id="product" name="product" required>
          <option value="" disabled selected>Select a Product ...</option>
          <!-- Options added by JavaScript -->
        </select>
      </fieldset>

      <!-- Overall Rating -->
       <!-- Overall Rating -->
<fieldset>
  <legend>Overall Rating</legend>
  <div class="rating">
    <input type="radio" id="star5" name="rating" value="5" required>
    <label for="star5" title="5 stars">☆</label>

    <input type="radio" id="star4" name="rating" value="4" required>
    <label for="star4" title="4 stars">☆</label>

    <input type="radio" id="star3" name="rating" value="3" required>
    <label for="star3" title="3 stars">☆</label>

    <input type="radio" id="star2" name="rating" value="2" required>
    <label for="star2" title="2 stars">☆</label>

    <input type="radio" id="star1" name="rating" value="1" required>
    <label for="star1" title="1 star">☆</label>
  </div>
</fieldset>


      <!-- Date of Installation -->
      <fieldset>
        <legend>Installation</legend>
        <label for="installed">Date of Installation</label>
        <input type="date" id="installed" name="installed" required>
      </fieldset>

      <!-- Useful Features -->
      <fieldset>
        <legend>Useful Features <span class="hint">(Check all that apply)</span></legend>
        
        <div class="checkbox-group">
          <input type="checkbox" id="feature1" name="features" value="durability">
          <label for="feature1">Durability</label>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="feature2" name="features" value="ease">
          <label for="feature2">Ease of Use</label>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="feature3" name="features" value="performance">
          <label for="feature3">Performance</label>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="feature4" name="features" value="design">
          <label for="feature4">Design</label>
        </div>
      </fieldset>

      <!-- Written Review -->
      <fieldset>
        <legend>Written Review <span class="hint">(Optional)</span></legend>
        <label for="review">Review</label>
        <textarea id="review" name="review" rows="5" placeholder="Share your experience with this product..."></textarea>
      </fieldset>

      <!-- User Name -->
      <fieldset>
        <legend>Your Information <span class="hint">(Optional)</span></legend>
        <label for="username">User Name</label>
        <input type="text" id="username" name="username" placeholder="Enter your name">
      </fieldset>

      <!-- Submit -->
      <input type="submit" value="Post Review">
    </form>
  </main>

  <footer>
    <p>&copy; <span id="currentYear"></span> | Samson Omale | WDD 131</p>
    <p>Last Modified: <span id="lastModified"></span></p>
  </footer>
</body>
</html>

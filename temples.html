<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="author" content="Samson Omale">
  <title>Temple Album | WDD 131</title>

  <!-- Mobile-first CSS -->
  <link rel="stylesheet" href="styles/temples.css">
